name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  changelog:
    name: git-cliff changelog
    runs-on: ubuntu-latest
    outputs:
      notes: RELEASE_NOTES.md
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate changelog for this tag
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
      - name: Write release notes
        run: |
          printf '%s' "${{ steps.cliff.outputs.changelog }}" > RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  release:
    name: GitHub release
    needs: [build, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

  publish:
    name: Publish to crates.io
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_TO_CRATES_IO == 'true' }}
    environment: crates.io
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish (macros first, then runtime)
        run: |
          cargo publish -p locolized-errors-macros --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          sleep 15
          cargo publish -p locolized-errors --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
