# git-cliff configuration: conventional commits, grouped sections,
# commit/PR links and a full compare URL footer.
# https://git-cliff.org

[changelog]
title_template = """\
# Changelog

All notable changes to this project are documented in this file.

Generated by [git-cliff](https://git-cliff.org) from [conventional commits](https://www.conventionalcommits.org).\
"""
# Keep the body as markdown lists grouped by type.
body_template = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}

    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} \
            ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/elcoosp/locolized-errors/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}

{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
  ### New contributors
  {% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
    * @{{ contributor.username }} made their first contribution
      {% if contributor.pr_number %} in \
        [#{{ contributor.pr_number }}](https://github.com/elcoosp/locolized-errors/pull/{{ contributor.pr_number }}) \
      {% endif %}
  {% endfor %}
{%- endif %}

{% if version %}
    {% if previous %}
        {% if previous.commit_id %}
            **Compare:** [{{ previous.tag | default(value=previous.commit_id | truncate(length=7, end="")) }}...{{ version }}](https://github.com/elcoosp/locolized-errors/compare/{{ previous.commit_id | default(value=previous.tag) }}...{{ commit_id }})
        {% endif %}
    {% endif %}
{% endif %}
"""
trim = true
footer_template = """\
---

*Changelog generated by [git-cliff](https://git-cliff.org).*\
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore|ci", group = "Miscellaneous Tasks" },
    { message = ".*", group = "Other" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

[github]
# Enables contributor recognition and compare links when GITHUB_REPO is set.
owner = "elcoosp"
repo = "locolized-errors"
